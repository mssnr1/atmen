<!doctype html>
<html lang="de" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f16" />
    <meta name="description" content="Fluo – sieh, was dein Atem in dir bewegt." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fluo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Fluo</title>
    <script>
      // The night look is the default. A stored day look is applied before the first paint, so the page never flashes.
      try {
        var p = JSON.parse(localStorage.getItem('breath.data') || '{}').preferences || {}
        var t = p.look === 2 ? p.theme : 'dark'
        if (t === 'light' || (t === 'system' && !matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.remove('dark')
          document.documentElement.style.colorScheme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f5f3')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
